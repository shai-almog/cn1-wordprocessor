# Builds and tests on the JVM, then builds the native application for every supported platform
# from the same source and uploads each one as a ready-to-run artifact. release.yml reuses it.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev

env:
  VERSION: ${{ inputs.version || 'dev' }}
  WORDPROCESSOR_MAVEN_REPO: ${{ github.workspace }}/.local/maven-repository

# A newer push to the same branch or PR supersedes older runs; tag (release) runs are never
# cancelled. When build.yml is called from release.yml the group is the caller's tag ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: .local/maven-repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
      # SimulatorUiTest boots the Codename One simulator, which needs an X display.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - run: xvfb-run -a scripts/build.sh

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac, os: macos-15, build: scripts/build-native.sh -DskipTests }
          - { platform: ios, os: macos-15, build: scripts/build-ios.sh -DskipTests }
          - { platform: android, os: ubuntu-24.04, build: scripts/build-android.sh -DskipTests }
          - { platform: web, os: ubuntu-24.04, build: scripts/build-web.sh }
          - { platform: linux, os: ubuntu-24.04, build: scripts/build-linux.sh -DskipTests }
          - { platform: linux, os: ubuntu-24.04-arm, build: scripts/build-linux.sh -DskipTests }
          - { platform: windows, os: windows-latest, arch: x64, build: scripts/build-windows.sh -DskipTests }
          - { platform: windows, os: windows-latest, arch: arm64, build: scripts/build-windows.sh -DskipTests }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      WINDOWS_ARCH: ${{ matrix.arch }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: .local/maven-repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
      - name: Linux toolchain (GTK3, CMake, clang)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build libgtk-3-dev libcairo2-dev \
            libpango1.0-dev libfontconfig1-dev libfreetype-dev libcurl4-openssl-dev libssl-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev libepoxy-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgeoclue-2-dev
      - name: Android toolchain
        if: matrix.platform == 'android'
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Visual Studio environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        # arm64 cross-compiles from the x64 runner; x64 libraries cannot link into it.
        with: { arch: "${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}" }
      - name: Build
        run: ${{ matrix.build }}
      - name: macOS signing identity
        # Repository secrets: MACOS_CERT_P12 (base64 Developer ID Application .p12) and
        # MACOS_CERT_PASSWORD; NOTARY_APPLE_ID, NOTARY_TEAM_ID and NOTARY_PASSWORD (an
        # app-specific password) for notarization, or the App Store Connect API key NOTARY_KEY_P8
        # (the .p8 text) with NOTARY_KEY_ID and NOTARY_ISSUER_ID, which is preferred: it skips the
        # Apple ID sign-in, whose outages fail notarization with HTTP 500. Absent secrets give an
        # ad-hoc signed app.
        if: matrix.platform == 'mac' && env.MACOS_CERT_P12 != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db" pw=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # The Developer ID G2 intermediate makes the identity valid even when the runner's
          # system keychain lacks it; without it find-identity -v lists nothing.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
          security import "$RUNNER_TEMP/g2.cer" -k "$kc" || true
          security find-identity -p codesigning "$kc"
          id=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          # Secrets that do not yield an identity are a configuration error, not an unsigned build.
          if [[ -z $id ]]; then echo "::error::MACOS_CERT_P12 holds no valid Developer ID Application identity"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Package
        timeout-minutes: 60
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/dist.sh ${{ matrix.platform }} "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: wordprocessor-${{ matrix.platform }}-${{ matrix.arch || runner.arch }}
          path: dist/*
          if-no-files-found: error
