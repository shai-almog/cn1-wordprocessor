# Public, reproducible evidence for every README claim, for this project and for Wordcraft at
# the pinned revision on the same runner images:
#   java / wordcraft  source size and tokens, functional-test cost (JVM vs cargo), JVM engine
#   desktop           native startup, idle RAM, latency and size vs Wordcraft on macOS, Linux, Windows
#                     against Wordcraft (scripts/native-bench)
#   ios / android / web  the same source built, launched and screenshotted on each target
name: metrics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  WORDCRAFT_REPO: https://github.com/storytold/wordcraft
  WORDCRAFT_REV: 159b84f54c74e9e82fb3109b758ae7dd6f4e3ab0

# A newer push to the same branch or PR supersedes older runs; tag (release) runs are never
# cancelled. When build.yml is called from release.yml the group is the caller's tag ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test (timed, cold Maven repository)
        run: |
          export WORDPROCESSOR_MAVEN_REPO="$PWD/.local/maven-repository"
          start=$(date +%s)
          mvn -B -ntp -Dmaven.repo.local="$WORDPROCESSOR_MAVEN_REPO" install | tee build.log
          echo "$(( $(date +%s) - start ))" > java-build-test-seconds.txt
      - name: Test only (timed, compiled)
        run: |
          export WORDPROCESSOR_MAVEN_REPO="$PWD/.local/maven-repository"
          start=$(date +%s)
          mvn -B -ntp -Dmaven.repo.local="$WORDPROCESSOR_MAVEN_REPO" \
            -pl common surefire:test | tee test.log
          echo "$(( $(date +%s) - start ))" > java-test-seconds.txt
          grep -h 'Tests run:' test.log | grep -v ' in ' | awk -F'[:,]' '{s+=$2} END{print s}' > java-tests.txt
      - name: JVM engine benchmark
        run: |
          export WORDPROCESSOR_MAVEN_REPO="$PWD/.local/maven-repository"
          mvn -B -ntp -Dmaven.repo.local="$WORDPROCESSOR_MAVEN_REPO" -pl common \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath \
            -DincludeScope=test -Dmdep.outputFile=target/test-classpath.txt
          scripts/benchmark.sh | tee java-benchmark.txt
      - name: Source metrics against pinned Wordcraft
        run: |
          git clone -q "$WORDCRAFT_REPO" wordcraft-src
          git -C wordcraft-src checkout -q "$WORDCRAFT_REV"
          sudo apt-get install -y -qq cloc
          python3 -m pip install -q -r scripts/metrics-requirements.txt
          python3 scripts/source-metrics.py wordcraft-src --out source-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: java-metrics
          path: |
            java-*.txt
            source-metrics.json

  wordcraft:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned Wordcraft
        run: |
          git clone -q "$WORDCRAFT_REPO" .
          git checkout -q "$WORDCRAFT_REV"
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tests (timed, cold)
        run: |
          start=$(date +%s)
          cargo test --workspace --locked --no-run
          echo "$(( $(date +%s) - start ))" > rust-build-test-seconds.txt
      - name: Run tests (timed, compiled)
        run: |
          start=$(date +%s)
          cargo test --workspace --locked 2>&1 | tee test.log || true
          echo "$(( $(date +%s) - start ))" > rust-test-seconds.txt
          grep -h '^test result' test.log | awk '{p+=$4} END{print p}' > rust-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-metrics
          path: rust-*.txt

  desktop:
    # The head-to-head native benchmark against Wordcraft on every desktop OS it ships for.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos, runner: macos-15}
          - {os: linux, runner: ubuntu-24.04}
          - {os: windows, runner: windows-latest}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      # The ParparVM translator (a forked JVM) exhausted the default heap on the Windows
      # runner while indexing natives; JAVA_TOOL_OPTIONS reaches every forked JVM.
      JAVA_TOOL_OPTIONS: ${{ matrix.os == 'windows' && '-Xmx8g' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'linux'
        name: Linux libraries and display
        run: |
          sudo apt-get update -qq
          # The CN1 Linux toolchain (as in build.yml) plus Wordcraft's winit/wgpu libraries.
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri clang cmake ninja-build \
            libgtk-3-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libfreetype-dev \
            libcurl4-openssl-dev libssl-dev libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev \
            libepoxy-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgeoclue-2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev
      - if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Source metrics
        if: matrix.os == 'macos'
        run: |
          git clone -q "$WORDCRAFT_REPO" "$RUNNER_TEMP/wordcraft-src" && git -C "$RUNNER_TEMP/wordcraft-src" checkout -q "$WORDCRAFT_REV"
          brew install -q cloc
          python3 -m venv .venv && .venv/bin/pip install -q -r scripts/metrics-requirements.txt
          .venv/bin/python scripts/source-metrics.py "$RUNNER_TEMP/wordcraft-src" --out artifacts/source-metrics.json
      - name: Builds, startup, RAM, workload and report
        run: |
          run=(); [[ ${{ matrix.os }} == linux ]] && run=(xvfb-run -a -s "-screen 0 1920x1080x24")
          "${run[@]}" scripts/native-bench/desktop.sh artifacts/native-bench/ci
          cat artifacts/native-bench/ci/native-benchmarks.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-native
          path: artifacts/native-bench/ci

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build for the iPhone simulator
        run: |
          repo="$PWD/.local/maven-repository"
          mvn -B -ntp -Dmaven.repo.local="$repo" package -DskipTests \
            -Dcodename1.platform=ios -Dcodename1.buildTarget=ios-source
          cd common/target/app-common-0.1.0-SNAPSHOT-ios-source
          xcodebuild -quiet -project Main.xcodeproj -scheme Main -configuration Release \
            -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/ios" CODE_SIGNING_ALLOWED=NO build
      - name: Launch, time and screenshot
        run: |
          app=$(ls -d "$RUNNER_TEMP"/ios/Build/Products/Release-iphonesimulator/Main.app)
          dev=$(xcrun simctl list devices available -j | python3 -c "import json,sys;print([d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if d['name'].startswith('iPhone')][0])")
          xcrun simctl boot "$dev"; xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" "$app"
          bid=$(defaults read "$app/Info" CFBundleIdentifier)
          for i in 1 2 3 4 5 6; do
            xcrun simctl terminate "$dev" "$bid" 2>/dev/null || true
            start=$(python3 -c 'import time;print(time.time())')
            xcrun simctl launch "$dev" "$bid" >/dev/null
            # Bounded: an app that never shows its window fails the job instead of hanging it.
            for t in $(seq 300); do
              xcrun simctl spawn "$dev" log show --last 30s --style compact --predicate 'process == "Main"' 2>/dev/null | grep -q 'UIKit:KeyWindow' && break
              [ $t = 300 ] && { echo 'The app did not start'; exit 1; }
              sleep 0.2
            done
            python3 -c "import time;print(round((time.time()-$start)*1000))" >> ios-launch-ms.txt
          done
          sleep 5
          xcrun simctl io "$dev" screenshot ios.png
          du -sk "$app" | cut -f1 > ios-app-kib.txt
          echo "iOS simulator launch-to-key-window ms: $(tr '\n' ' ' < ios-launch-ms.txt); app KiB: $(cat ios-app-kib.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: ios*

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the APK
        run: |
          export JAVA17_HOME="$JAVA_HOME"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export WORDPROCESSOR_MAVEN_REPO="$PWD/.local/maven-repository"
          scripts/build-android.sh -DskipTests
          find common/target -name '*.apk' | head -1 > apk-path.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch, time and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r "$(cat apk-path.txt)"
            pkg=com.codenameone.wordprocessor.app
            act=$(adb shell cmd package resolve-activity --brief $pkg | tail -1 | tr -d '\r')
            for i in 1 2 3 4 5 6; do adb shell am force-stop $pkg; adb shell am start -W -n "$act" | grep TotalTime | awk '{print $2}' >> android-launch-ms.txt; sleep 2; done
            sleep 8; adb exec-out screencap -p > android.png
            stat -c %s "$(cat apk-path.txt)" > android-apk-bytes.txt
            echo "Android cold start TotalTime ms: $(tr '\n' ' ' < android-launch-ms.txt); APK bytes: $(cat android-apk-bytes.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: android*

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the browser app
        run: |
          export WORDPROCESSOR_MAVEN_REPO="$PWD/.local/maven-repository"
          scripts/build-web.sh
          du -sk common/target/web-preview | cut -f1 > web-kib.txt
      - name: Headless run and screenshot
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 --directory common/target/web-preview &
          sleep 1
          CHROME="$(command -v google-chrome)" node scripts/web-smoke.mjs http://127.0.0.1:8768/index.html web.png \
            '["Quarterly Product Review","Written in the browser build of the same Java source."]'
          echo "Web bundle KiB: $(cat web-kib.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web
          path: web*

  summary:
    needs: [java, wordcraft]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
      - name: Comparison table
        run: |
          r() { cat "$1" 2>/dev/null || echo n/a; }
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          m = json.load(open('java-metrics/source-metrics.json'))
          j, w = m['cn1Java']['groups']['application'], m['wordcraftRust']['groups']['application']
          print('| Metric | CN1 / Java | Wordcraft / Rust |')
          print('| --- | ---: | ---: |')
          print(f"| Application code lines (no tests, no comments) | {j['prunedLoc']['code']:,} | {w['prunedLoc']['code']:,} |")
          print(f"| Application tokens (o200k_base, tests pruned) | {j['testPrunedTokens']:,} | {w['testPrunedTokens']:,} |")
          EOF
          {
            echo "| Cold build + tests (s) | $(r java-metrics/java-build-test-seconds.txt) | $(r wordcraft-metrics/rust-build-test-seconds.txt) (build only) |"
            echo "| Test run, compiled (s) | $(r java-metrics/java-test-seconds.txt) | $(r wordcraft-metrics/rust-test-seconds.txt) |"
            echo "| Tests executed | $(r java-metrics/java-tests.txt) | $(r wordcraft-metrics/rust-tests.txt) |"
          } >> "$GITHUB_STEP_SUMMARY"
