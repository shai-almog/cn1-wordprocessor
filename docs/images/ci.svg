<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" viewBox="0 0 760 216" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>text{fill:#1f2328}.muted{fill:#59636e}rect.bg{fill:#ffffff}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.muted{fill:#9198a1}rect.bg{fill:#0d1117}}</style>
<rect class="bg" width="760" height="216" rx="8"/>
<text x="16" y="28" font-size="17" font-weight="600">Test-suite cost</text>
<text x="16" y="48" font-size="12" class="muted">seconds on the same machine · lower is better</text>
<rect x="510" y="16" width="12" height="12" fill="#2f7ff0"/><text x="528" y="27" font-size="12">Java / Codename One</text>
<rect x="510" y="34" width="12" height="12" fill="#e0663a"/><text x="528" y="45" font-size="12">Rust / Wordcraft</text>
<text x="16" y="86" font-size="13">Build + run tests, cold</text>
<rect x="190" y="64" width="18.2" height="18" rx="3" fill="#2f7ff0"/>
<text x="214.2" y="77" font-size="12">8.0</text>
<rect x="190" y="84" width="420.0" height="18" rx="3" fill="#e0663a"/>
<text x="616.0" y="97" font-size="12">185</text>
<text x="744" y="86" font-size="12" font-weight="600" text-anchor="end" fill="#2f7ff0">23.1× better</text>
<text x="16" y="140" font-size="13">Run tests, compiled</text>
<rect x="190" y="118" width="13.6" height="18" rx="3" fill="#2f7ff0"/>
<text x="209.6" y="131" font-size="12">6.0</text>
<rect x="190" y="138" width="45.4" height="18" rx="3" fill="#e0663a"/>
<text x="241.4" y="151" font-size="12">20.0</text>
<text x="744" y="140" font-size="12" font-weight="600" text-anchor="end" fill="#2f7ff0">3.3× better</text>
<text x="16" y="200" font-size="11" class="muted">623 Java tests vs 1,921 Rust tests. Source: docs/ci-metrics.json, CI workflow metrics.yml</text></svg>
