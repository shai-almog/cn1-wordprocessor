<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>text{fill:#1f2328}.muted{fill:#59636e}rect.bg{fill:#ffffff}@media (prefers-color-scheme:dark){text{fill:#e6edf3}.muted{fill:#9198a1}rect.bg{fill:#0d1117}}</style>
<rect class="bg" width="760" height="432" rx="8"/>
